<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2a44" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Wiskas — искусство, море и мечты. Зажми портал на 3 секунды, чтобы услышать море." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Wiskas — link in bio" />
  <meta property="og:description" content="Искусство, море и мечты. Зажми портал на 3 секунды, чтобы услышать море." />
  <meta property="og:image" content="./assets/banner.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Wiskas — link in bio</title>

  <link rel="icon" type="image/png" href="./assets/avatar.png" />
  <link rel="apple-touch-icon" href="./assets/avatar.png" />

  <link rel="preload" href="./assets/fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./assets/fonts/oswald-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./assets/fonts/comfortaa-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./assets/fonts/comfortaa-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./assets/banner.png" as="image" />
  <link rel="preload" href="./assets/avatar.png" as="image" />

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="page">

  <!-- Живой фон: фото медленно дрейфует, световые пятна и боке двигаются независимо -->
  <div class="scene" aria-hidden="true">
    <div class="scene__parallax">
      <div class="scene__photo"></div>
      <div class="scene__haze"></div>
      <div class="scene__orbs">
        <span class="scene__orb scene__orb--1"></span>
        <span class="scene__orb scene__orb--2"></span>
        <span class="scene__orb scene__orb--3"></span>
        <span class="scene__orb scene__orb--4"></span>
      </div>
    </div>
    <div class="scene__bokeh"></div>
    <div class="scene__tint"></div>
    <div class="scene__vignette"></div>
  </div>

  <main class="page__main" id="main" tabindex="-1">
    <article class="profile" aria-label="Wiskas — все ссылки в одном месте">

      <div class="profile__banner">
        <img
          class="profile__banner-img"
          src="./assets/banner.png"
          alt="Аниме-девушка смотрит на синее море"
          width="725"
          height="343"
          decoding="async"
        />
      </div>

      <div class="profile__avatar">
        <img
          class="profile__avatar-img"
          src="./assets/avatar.png"
          alt="Аватар Wiskas"
          width="331"
          height="331"
          decoding="async"
        />
      </div>

      <div class="profile__body">
        <blockquote class="profile__bio">
          <p class="profile__bio-text">
            <span class="profile__bio-line">«Море, однажды околдовав,</span>
            <span class="profile__bio-line">навсегда держит в сетях чуда»</span>
            <span class="profile__bio-line profile__bio-line--author">— Жак Ив Кусто</span>
          </p>
        </blockquote>

        <nav class="profile__links" aria-label="Мои Telegram-каналы">
          <a
            class="profile__link"
            href="https://t.me/doxernet"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="doxernet.t.me в Telegram"
          >
            <span class="profile__link-icon" aria-hidden="true">
              <svg class="profile__icon" viewBox="0 0 24 24" fill="currentColor" focusable="false">
                <path d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm4.96 7.22c.1 0 .32.03.46.14a.5.5 0 0 1 .18.33c.01.09.03.3.02.47-.18 1.9-.96 6.5-1.36 8.63-.17.9-.5 1.2-.82 1.23-.7.06-1.23-.46-1.9-.9-1.06-.7-1.65-1.13-2.68-1.8-1.19-.78-.42-1.21.26-1.91.18-.19 3.25-2.98 3.31-3.23 0-.03.01-.15-.06-.21-.06-.06-.17-.04-.24-.02-.11.02-1.8 1.14-5.07 3.34-.48.33-.91.49-1.3.48-.43 0-1.25-.24-1.86-.44-.76-.25-1.35-.37-1.3-.79.03-.22.33-.44.9-.66 3.5-1.53 5.83-2.53 7-3.02 3.33-1.38 4.02-1.63 4.47-1.63Z" />
              </svg>
            </span>
            <span class="profile__link-meta">
              <span class="profile__link-name">DoxerNet</span>
              <span class="profile__link-handle">doxernet.t.me</span>
            </span>
            <svg class="profile__link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M7 17 17 7" />
              <path d="M8 7h9v9" />
            </svg>
          </a>

          <a
            class="profile__link"
            href="https://t.me/rivalvisuals"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="rivalvisuals.t.me в Telegram"
          >
            <span class="profile__link-icon" aria-hidden="true">
              <svg class="profile__icon" viewBox="0 0 24 24" fill="currentColor" focusable="false">
                <path d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm4.96 7.22c.1 0 .32.03.46.14a.5.5 0 0 1 .18.33c.01.09.03.3.02.47-.18 1.9-.96 6.5-1.36 8.63-.17.9-.5 1.2-.82 1.23-.7.06-1.23-.46-1.9-.9-1.06-.7-1.65-1.13-2.68-1.8-1.19-.78-.42-1.21.26-1.91.18-.19 3.25-2.98 3.31-3.23 0-.03.01-.15-.06-.21-.06-.06-.17-.04-.24-.02-.11.02-1.8 1.14-5.07 3.34-.48.33-.91.49-1.3.48-.43 0-1.25-.24-1.86-.44-.76-.25-1.35-.37-1.3-.79.03-.22.33-.44.9-.66 3.5-1.53 5.83-2.53 7-3.02 3.33-1.38 4.02-1.63 4.47-1.63Z" />
              </svg>
            </span>
            <span class="profile__link-meta">
              <span class="profile__link-name">RivalVisuals</span>
              <span class="profile__link-handle">rivalvisuals.t.me</span>
            </span>
            <svg class="profile__link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M7 17 17 7" />
              <path d="M8 7h9v9" />
            </svg>
          </a>
        </nav>

        <div class="profile__divider" role="presentation"></div>

        <footer class="profile__footer">
          <a class="profile__credit" href="https://t.me/doxernet" target="_blank" rel="noopener noreferrer">doxernet.t.me</a>
          <span class="profile__credit-sep" aria-hidden="true"></span>
          <a class="profile__credit" href="https://t.me/rivalvisuals" target="_blank" rel="noopener noreferrer">rivalvisuals.t.me</a>
        </footer>
      </div>

    </article>
  </main>

  <!-- Кнопка управления музыкой, появляется после старта -->
  <button
    class="sound"
    id="sound"
    type="button"
    aria-label="Выключить музыку"
    aria-pressed="true"
    aria-keyshortcuts="M"
  >
    <svg class="sound__icon sound__icon--on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" />
      <path d="M15 9.5a4 4 0 0 1 0 5" />
      <path d="M17.8 6.7a8 8 0 0 1 0 10.6" />
    </svg>
    <svg class="sound__icon sound__icon--off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" />
      <path d="m16 9 5 6" />
      <path d="m21 9-5 6" />
    </svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast__text">Зажми портал, чтобы включить звук</span>
  </div>

  <!-- Стартовый экран: портал открывается удержанием кнопки 3 секунды -->
  <div class="intro" id="intro">
    <canvas class="intro__warp" id="warp-canvas" aria-hidden="true"></canvas>
    <span class="intro__lens" aria-hidden="true"></span>

    <button
      class="portal"
      id="portal"
      type="button"
      aria-label="Открыть портал: зажми кнопку на 3 секунды"
      aria-describedby="portal-hint"
    >
      <span class="portal__core">
        <span class="portal__orbit" aria-hidden="true"></span>
        <span class="portal__disc">
          <span class="portal__value" id="portal-value">0%</span>
          <span class="portal__label">портал</span>
        </span>
      </span>
      <span class="portal__hint" id="portal-hint">зажми на 3 секунды</span>
      <span class="sr-only" id="portal-status" role="status" aria-live="polite"></span>
    </button>
  </div>

  <audio class="audio" id="audio" preload="auto" loop playsinline>
    <source src="./assets/bcmusic.mp3" type="audio/mpeg" />
  </audio>

  <script src="./js/app.js" defer></script>
</body>
</html>
